<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>AI LÀ GIÁN ĐIỆP – DATHOINEEE</title>
    <script>
      (function () {
        var path = window.location.pathname || "/";
        var search = window.location.search || "";
        var targetHash = path === "/" ? "/" : path;
        window.location.replace(
          window.location.origin + "/#" + targetHash + search
        );
      })();
    </script>
  </head>
  <body></body>
</html>
